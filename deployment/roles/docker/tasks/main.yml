---

- name: Install Docker.
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg2
      - python3-pip
      - docker.io
      - docker-cli
      - docker-buildx
      - docker-compose
      - python3-docker
    update_cache: true
    cache_valid_time: 3600

- name: Enable Docker.
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create /etc/docker/daemon.json.
  ansible.builtin.template:
    src: etc/docker/daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Create docker directory.
  ansible.builtin.file:
    path: /srv/docker
    state: directory
    owner: root
    group: docker
    mode: "0755"
